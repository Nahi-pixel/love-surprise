<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3b071c">
<title>For ኪያየ ❤️</title>
<style>
  * { box-sizing: border-box; }
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; overflow-x: hidden;
    display: grid; place-items: center; padding: 24px;
    font-family: Georgia, "Times New Roman", serif;
    color: #fff7fa;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255,89,151,.24), transparent 48%),
      radial-gradient(ellipse at 0% 100%, rgba(255,30,99,.15), transparent 42%),
      linear-gradient(145deg, #18040e, #4b0924 52%, #210510);
  }
  .glow { position: fixed; inset: 0; pointer-events: none; opacity: .55;
    background: radial-gradient(circle at 50% 48%, rgba(255,76,137,.13), transparent 48%); }
  .heart {
    position: fixed; bottom: -50px; color: #ff7eaa; opacity: .7;
    animation: floatUp linear infinite; pointer-events: none;
    text-shadow: 0 0 16px rgba(255,87,145,.8);
  }
  .heart:nth-of-type(1) { left: 8%; animation-duration: 13s; font-size: 20px; }
  .heart:nth-of-type(2) { left: 22%; animation-duration: 17s; animation-delay: -6s; font-size: 13px; }
  .heart:nth-of-type(3) { left: 77%; animation-duration: 15s; animation-delay: -4s; font-size: 24px; }
  .heart:nth-of-type(4) { left: 91%; animation-duration: 19s; animation-delay: -10s; font-size: 15px; }
  @keyframes floatUp { from { transform: translateY(0) rotate(0); } to { transform: translateY(-120vh) rotate(35deg); } }
  main {
    position: relative; width: min(100%, 580px); text-align: center;
    padding: clamp(30px, 7vw, 58px) clamp(22px, 6vw, 48px);
    border: 1px solid rgba(255,195,216,.38); border-radius: 28px;
    background: rgba(44, 5, 22, .60); backdrop-filter: blur(8px);
    box-shadow: 0 0 70px rgba(255,54,119,.16), inset 0 0 35px rgba(255,255,255,.025);
  }
  .eyebrow { text-transform: uppercase; letter-spacing: .22em; font: 11px/1.6 Arial,sans-serif; color: #ffb7d0; }
  .heartmark { font-size: 48px; margin: 16px 0 8px; filter: drop-shadow(0 0 15px #ff477f); }
  h1 { font-size: clamp(38px, 10vw, 64px); line-height: 1.05; font-weight: normal; margin: 8px 0 20px; }
  .message { font-size: clamp(20px, 5vw, 27px); line-height: 1.55; color: #ffe4ed; margin: 0 auto; }
  .rule { width: 68px; height: 1px; margin: 28px auto; background: #ff91b6; }
  .button {
    border: 1px solid rgba(255,202,221,.65); border-radius: 999px;
    padding: 13px 24px; color: white; background: rgba(255,91,145,.16);
    font: 14px Arial,sans-serif; letter-spacing: .04em; cursor: pointer;
    transition: transform .2s, background .2s;
  }
  .button:hover { transform: translateY(-2px); background: rgba(255,91,145,.28); }
  #surprise { display: none; margin-top: 24px; font-size: 19px; line-height: 1.7; color: #ffd0df; }
  .footer { margin-top: 34px; color: #d99bad; font: 11px/1.6 Arial,sans-serif; letter-spacing: .12em; }
  @media (prefers-reduced-motion: reduce) { .heart { animation: none; display:none; } }
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<div class="heart" aria-hidden="true">♥</div>
<div class="heart" aria-hidden="true">♡</div>
<div class="heart" aria-hidden="true">♥</div>
<div class="heart" aria-hidden="true">♡</div>
<main>
  <div class="eyebrow">A little surprise, made with love</div>
  <div class="heartmark" aria-hidden="true">❤️</div>
  <h1>For ኪያየ 🫶🏾👸🏻</h1>
  <p class="message">You make my world more beautiful. ❤️</p>
  <div class="rule"></div>
  <button class="button" id="reveal" type="button">Open your little surprise 💌</button>
  <p id="surprise">No matter how ordinary a day may be, you have a way of making it feel special. This page is a small reminder that you are appreciated. 💗</p>
  <div class="footer">MADE JUST FOR YOU · WITH LOVE ♥</div>
</main>
<script>
  const button = document.getElementById('reveal');
  const surprise = document.getElementById('surprise');
  button.addEventListener('click', () => {
    const opening = surprise.style.display !== 'block';
    surprise.style.display = opening ? 'block' : 'none';
    button.textContent = opening ? 'Close surprise ✨' : 'Open your little surprise 💌';
  });
</script>
</body>
</html>
